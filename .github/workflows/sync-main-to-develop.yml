# Back-merge: every push to main opens or updates a PR from
# sync/main-to-develop into develop. A maintainer merges it.
name: Sync main to develop

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Runs queue in order. Each run resets the sync branch to the newest main.
concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: sync/main-to-develop
      # PRs opened or pushed with GITHUB_TOKEN do not trigger pull_request
      # workflows, so required checks never report on the sync PR. Set
      # AUTOMATION_TOKEN to a fine-grained PAT or GitHub App token with
      # contents and pull-requests write.
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check whether develop already contains main
        id: ahead
        run: |
          set -euo pipefail
          git fetch origin develop
          AHEAD=$(git rev-list --count origin/develop..origin/main)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "develop already contains main. Nothing to sync."
          fi

      - name: Reset sync branch to main and push
        if: steps.ahead.outputs.ahead != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Automation owns this branch. The naming ruleset exempts sync/**,
          # and no ruleset protects it, so a force push is expected here.
          git branch -f "$SYNC_BRANCH" origin/main
          git push --force origin "$SYNC_BRANCH"

      - name: Open or update the PR into develop
        if: steps.ahead.outputs.ahead != '0'
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BODY="Automated back-merge of main into develop.

          Triggered by push ${TRIGGER_SHA} to main. Squash merge this PR so develop
          receives the release bump, hotfix, or docs change. Do not edit the branch."

          # Idempotent: reuse the open PR if one exists.
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING is open. The branch push already updated it."
            gh pr edit "$EXISTING" --body "$BODY"
          else
            # The sync label is created by scripts/setup-github.*. Fall back
            # to an unlabelled PR rather than failing the back-merge.
            gh pr create --base develop --head "$SYNC_BRANCH" \
              --title "chore(sync): merge main into develop" \
              --label sync --body "$BODY" \
            || gh pr create --base develop --head "$SYNC_BRANCH" \
              --title "chore(sync): merge main into develop" \
              --body "$BODY"
          fi

          # Auto-merge is off by default. To turn it on:
          #   1. Settings -> General -> Pull Requests -> enable "Allow auto-merge".
          #   2. Uncomment the next line. The PR still waits for required checks
          #      and the approving review demanded by the develop ruleset.
          # gh pr merge --auto --squash "$SYNC_BRANCH"
